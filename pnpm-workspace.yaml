# pnpm's settings for the site, the root its one package: the file has no packages: key, so pnpm
# treats no directory below it as a workspace member.
#
# minimumReleaseAge: 0 turns off pnpm's default wait of a day before it installs a release. The
# currency task moves each pin to its latest release, and that release's notes are read before the
# bump lands, a review that stands in for the age gate; with the wait on, a frozen install of a
# lockfile that pins a release under a day old fails, the scaffold's first install and CI's among
# them.
# From spike-html-hosting-sdk (v0.2.0): template/pnpm-workspace.yaml.
minimumReleaseAge: 0
