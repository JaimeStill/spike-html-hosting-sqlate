# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
# Adapted from spike-html-apps-foundation (d5037b4): mise.toml, its toolchain and tasks over the
# site's Vite build in place of the package's tsc build.
# Adapted from spike-html-hosting (cb0511c): mise.toml, its build, unit tier, and browser tier over
# the copied Markdown pages, and its chrome-headless-shell 157.0.8103.38.
# From spike-html-hosting-architecture (18eaa89): mise.toml.
[settings]
task.run_auto_install = false

# spike-html-apps-foundation's toolchain, at its pins.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.38"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:deafffa74660b34853a4119c361fd427ac8c9fcb62db51ddb8a797cd83a4ba2d", size = "128168542" }

[tasks.preflight]
description = "Fail naming mise run install when the node_modules tooling is missing, and with the browser argument the pinned chrome-headless-shell; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint (the leftover check on dist/ included), Prettier, shellcheck, and actionlint; reads no network, writes dist/"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

# The leftover check reads the build, so the lint follows it: with no dist/, it would pass on
# nothing.
[tasks."lint:eslint"]
description = "Lint with ESLint (eslint.config.js): the recommended rules over the code, and the leftover check, no CSS module script in dist/, after the build; reads no network, writes dist/"
depends = ["preflight", "build"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (.prettierrc.json, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
run = "actionlint"
dir = "{{config_root}}"

[tasks.types]
description = "Type-check the configs (tsconfig.json) and the suite (tsconfig.test.json) with tsc; reads no network, writes nothing"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check eslint.config.js, vite.config.ts, and markdown-pages.ts with tsc; reads no network, writes nothing"
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."types:test"]
description = "Type-check the suite, test/'s TypeScript that node --test runs under type stripping, with tsc against tsconfig.test.json; reads no network, writes nothing"
run = "tsc -p tsconfig.test.json"
dir = "{{config_root}}"

[tasks.build]
description = "Build the site with Vite (vite.config.ts): a page for each Markdown file in content/, in index.html's shell, and the foundation modules the shell loads into dist/, under the Pages base; reads no network, writes dist/"
depends = ["preflight"]
run = "pnpm exec vite build"
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: the leftover check over fixtures of built output, in a scratch directory of TMPDIR, removed after; content/ against content.json's blob hashes; and the Markdown pages' rendering; reads no network, writes nothing in the repository"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.ts'"
dir = "{{config_root}}"

[tasks."test:browser"]
description = "Run the browser tier after the build: dist/ under the base by Vite's preview, in the pinned chrome-headless-shell, the theme menu opened with its sheet adopted, and on T, each facet's choice set on the root, and every page crawled from the index, its title, layout width, links, and fragments checked and every request under the base; reads no network, writes dist/"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, build, test:unit, and test:browser; reads no network, writes dist/ (gitignored) and nothing else outside TMPDIR"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install every mise.toml pin and node_modules from pnpm-lock.yaml; reads the network, writes node_modules/"
run = ["mise install", "pnpm install --frozen-lockfile"]
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), and workflow action pin behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
