# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
# Adapted from spike-html-apps-foundation (d5037b4): mise.toml, its toolchain and tasks over the
# site's Vite build in place of the package's tsc build.
# Adapted from spike-html-hosting (cb0511c): mise.toml, its build, unit tier, and browser tier over
# the copied Markdown pages.
# Adapted from spike-html-hosting (c161b7d): mise.toml, its chrome-headless-shell, since bumped.
# Adapted from spike-html-hosting-architecture (27d70e1): mise.toml, its tiers the SDK's checks and
# its currency the SDK's bin.
# From spike-html-hosting-sdk (v0.6.0): template/mise.toml.
[settings]
task.run_auto_install = false

# The SDK's toolchain, at its pins.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.18.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
# The quick-start program's toolchain: quick-start/ is its own Go module.
go = "1.27.3"

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.50"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:7bf0d41e424efd1d6281c4162993ab9dc5de92fac213c211614905a71c057d0f", size = "128166087" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint (the leftover check on dist/ included), Prettier, shellcheck, and actionlint; reads no network, writes dist/"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

# The leftover check reads the build, so the lint follows it: with no dist/, it would pass on
# nothing.
[tasks."lint:eslint"]
description = "Lint with ESLint (eslint.config.js, the SDK's configuration): the recommended rules over the code, and the leftover check, no CSS module script in dist/, after the build; reads no network, writes dist/"
depends = ["preflight", "build"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (the SDK's configuration, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
run = "actionlint"
dir = "{{config_root}}"

[tasks.types]
description = "Type-check the configs (tsconfig.json) and the suite (tsconfig.test.json) with tsc; reads no network, writes nothing"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check eslint.config.js and vite.config.ts with tsc; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."types:test"]
description = "Type-check the suite, test/'s TypeScript that node --test runs under type stripping, and the capture file, scripts/screenshots.config.ts, with tsc against tsconfig.test.json; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"
dir = "{{config_root}}"

[tasks.build]
description = "Build the site with Vite (vite.config.ts): a page for each Markdown file in content/, in index.html's shell, and the foundation modules the shell loads into dist/, under the Pages base; reads no network, writes dist/"
depends = ["preflight"]
run = "pnpm exec vite build"
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: content/ against content.json's blob hashes, with the SDK's content check; reads no network, writes nothing"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.ts'"
dir = "{{config_root}}"

# The program the quick-start guide builds, quick-start/, its own Go module outside any go.work:
# vetted, tested through sqltest with no database, and linted with its sqlint tool, at go.mod's
# pins from the module cache mise run install fills. Docker and PostgreSQL stay out of the check;
# the program's own mise.toml runs it live.
[tasks."test:program"]
description = "Vet the quick-start program, run its tests (sqltest, no database), and lint its SQL with sqlint, offline: GOPROXY=off, GOWORK=off; reads no network, writes nothing outside the Go caches"
depends = ["preflight program"]
run = [
  "go -C quick-start vet ./...",
  "go -C quick-start test ./...",
  "go -C quick-start tool sqlint .",
]
env = { GOPROXY = "off", GOWORK = "off", GOTOOLCHAIN = "local" }
dir = "{{config_root}}"

[tasks."test:browser"]
description = "Run the browser tier after the build, the SDK's checks: dist/ under the base by Vite's preview, in the pinned chrome-headless-shell, the shell checks on the index and every page crawled from it; and the screenshots command on the index, its captures under a scratch TMPDIR removed after unless --keep; reads no network, writes dist/"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, build, test:unit, test:program, and test:browser; reads no network, writes dist/ (gitignored) and nothing else outside TMPDIR and the Go caches"
depends = ["lint", "types", "build", "test:unit", "test:program", "test:browser"]

# Never a dependency of check: a reviewer's look at the site's pages, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.ts; the
# browser tier runs it once (test/browser/screenshots.test.ts).
# Adapted from spike-html-apps-components (19d4f59): mise.toml, its screenshots task.
[tasks.screenshots]
description = "Capture every page whole at 390, 1120, and 1376px, and the index with Help and Settings open at each, light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep; reads no network, writes dist/ and the captures, under TMPDIR unless --dir"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec spike-html-apps-screenshots scripts/screenshots.config.ts"
dir = "{{config_root}}"

# Never a dependency of check, and never run in CI: the recordings are committed, and the unit
# tier's recordings test fails naming any whose inputs changed since it was rendered. MISE_ENV
# loads mise.tapes.toml, whose vhs, ttyd, and ffmpeg no other task installs; Docker runs the
# recordings' PostgreSQL.
[tasks.tapes]
description = "Render the quick-start's recordings whose inputs changed, and any named (mise run tapes step-12-sql), from tapes/*.tape with mise.tapes.toml's vhs, ttyd, and ffmpeg in the pinned chrome-headless-shell, each in a clean copy of the program at its step, PostgreSQL started by Docker for those that run it; reads the network (the tools and the image), writes tapes/*.webm and tapes/rendered.json"
run = "mise install && node scripts/tapes.ts"
env = { MISE_ENV = "tapes" }
dir = "{{config_root}}"

[tasks.install]
description = "Install every mise.toml pin, node_modules from pnpm-lock.yaml, and the quick-start program's modules from its go.mod and go.sum into the module cache; reads the network, writes node_modules/ and the module cache"
run = [
  "mise install",
  "pnpm install --frozen-lockfile",
  "GOWORK=off GOTOOLCHAIN=local go -C quick-start mod download",
]
dir = "{{config_root}}"

# The SDK's currency bin, which a pnpm install links into node_modules/.bin.
[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), and workflow action or reusable workflow pin behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "pnpm exec spike-html-hosting-currency"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
