# The tools that render the quick-start's recordings, which mise loads only under MISE_ENV=tapes:
# mise run tapes sets it, so its mise install and its mise which read these pins, and the default
# mise install, which mise run install and the workflows' mise-action run, never fetches them. The
# recordings' input hash reads each pin here (scripts/recordings.ts), so a bump stales them all.
# vhs drives ttyd in the pinned chrome-headless-shell (mise.toml) and encodes with ffmpeg; mise's
# registry gives conda:ffmpeg, a conda-forge build with libvpx for VHS's WebM.
[tools]
"aqua:charmbracelet/vhs" = "0.12.1"
"aqua:tsl0922/ttyd" = "1.7.7"
"conda:ffmpeg" = "9.0.2"
