<!doctype html>
<!-- The sqlate stand-in's GitHub Pages site: the shell every page of the build fills
     (markdown-pages.ts), its title the page's name and its main element the page's body. The
     foundation's page entry, its registrations, and its preferences module, render-blocking as the
     foundation's README "Use" section loads them, and a button that opens the theme menu.
     Adapted from spike-html-hosting (cb0511c): index.html, its title and text this site's, and its
     page a shell.
     Adapted from spike-html-hosting-architecture (c4deeff): index.html, its title and text the
     sqlate stand-in's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The sqlate stand-in</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
  </head>
  <body>
    <header>
      <button type="button" commandfor="theme" command="--open">Theme</button>
    </header>
    <main></main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
