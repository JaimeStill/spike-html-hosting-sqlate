<!doctype html>
<!-- The sqlate stand-in's GitHub Pages site: the foundation's page entry, its registrations, and
     its preferences module, render-blocking as the foundation's README "Use" section loads them,
     and a button that opens the theme menu.
     Adapted from spike-html-hosting (cb0511c): index.html, its title and text the sqlate
     stand-in's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The sqlate stand-in</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
  </head>
  <body>
    <main>
      <h1>The sqlate stand-in</h1>
      <p>
        This site is the sqlate stand-in's docs site of spike-html-hosting, a spike on hosting
        GitHub Pages sites and persistent artifacts as native web. Its guide arrives in a later
        task.
      </p>
      <p><button type="button" commandfor="theme" command="--open">Theme</button></p>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
